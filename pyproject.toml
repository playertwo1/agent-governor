[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governor"
version = "1.0.0"
description = "Fail-closed, reusable governance gates for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rafael Pedrosa Goncalves"}]
dependencies = []

[project.scripts]
governor = "agent_governor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
